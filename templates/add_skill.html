{% extends "base.html" %}

{% block title %}Add Skill{% endblock %}

{% block content %}

<div class="container">

    <a href="{{ url_for('admin.dashboard') }}" class="back-link"><span aria-hidden="true">←</span> cd ..<span class="visually-hidden"> (back to dashboard)</span></a>

    <header class="page-header">
        <p class="eyebrow">admin</p>
        <h1 class="fw-bold mb-2">Add Skill</h1>
        <p class="text-muted mb-0">Add a new skill to your portfolio.</p>
    </header>


    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label for="name" class="form-label fw-semibold">
                        Skill Name
                    </label>

                    <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Python" required>

                </div>


                <div class="mb-3">

                    <label for="category" class="form-label fw-semibold">
                        Category
                    </label>

                    <input type="text" class="form-control" id="category" name="category" placeholder="e.g. Programming"
                        required>

                </div>


                <div class="mb-4">

                    <label for="proficiency" class="form-label fw-semibold">
                        Proficiency
                    </label>

                    <input type="text" class="form-control" id="proficiency" name="proficiency"
                        placeholder="e.g. Intermediate" required>

                </div>


                <div class="d-flex gap-2">

                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">
                        Back
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Add Skill
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
