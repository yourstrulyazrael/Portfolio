{% extends "base.html" %}

{% block title %}Edit Certificate{% endblock %}

{% block content %}

<div class="container">

    <a href="{{ url_for('admin.dashboard') }}" class="back-link"><span aria-hidden="true">←</span> cd ..<span class="visually-hidden"> (back to dashboard)</span></a>

    <header class="page-header">
        <p class="eyebrow">admin</p>
        <h1 class="fw-bold mb-2">Edit Certificate</h1>
        <p class="text-muted mb-0">Update the information for your certificate.</p>
    </header>


    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                {% include "_certificate_form.html" %}

                <div class="d-flex gap-2 mt-4">

                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
