{% macro icon(name, class="icon") -%}
<svg class="{{ class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
    stroke-linejoin="round" aria-hidden="true">
    {%- if name == 'external' %}
    <path d="M14 4h6v6"></path>
    <path d="M10 14 20 4"></path>
    <path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"></path>
    {%- elif name == 'github' %}
    <path
        d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21">
    </path>
    {%- elif name == 'arrow-right' %}
    <path d="M5 12h14"></path>
    <path d="m12 5 7 7-7 7"></path>
    {%- elif name == 'image' %}
    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
    <circle cx="9" cy="9" r="2"></circle>
    <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path>
    {%- elif name == 'mail' %}
    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
    <path d="m22 7-10 6L2 7"></path>
    {%- elif name == 'sun' %}
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
    {%- elif name == 'moon' %}
    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
    {%- elif name == 'monitor' %}
    <rect x="2" y="3" width="20" height="14" rx="2"></rect>
    <path d="M8 21h8M12 17v4"></path>
    {%- elif name == 'terminal' %}
    <path d="m4 17 6-6-6-6"></path>
    <path d="M12 19h8"></path>
    {%- elif name == 'code' %}
    <path d="m16 18 6-6-6-6"></path>
    <path d="m8 6-6 6 6 6"></path>
    {%- elif name == 'palette' %}
    <circle cx="13.5" cy="6.5" r="1.5"></circle>
    <circle cx="17.5" cy="10.5" r="1.5"></circle>
    <circle cx="8.5" cy="7.5" r="1.5"></circle>
    <circle cx="6.5" cy="12.5" r="1.5"></circle>
    <path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 10c0-4.4-4.5-8-10-8Z"></path>
    {%- elif name == 'award' %}
    <circle cx="12" cy="9" r="6"></circle>
    <path d="M8.5 13.5 7 22l5-3 5 3-1.5-8.5"></path>
    {%- elif name == 'grid' %}
    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
    {%- elif name == 'layers' %}
    <path d="m12 2 10 5-10 5L2 7l10-5Z"></path>
    <path d="m2 17 10 5 10-5"></path>
    <path d="m2 12 10 5 10-5"></path>
    {%- elif name == 'inbox' %}
    <path d="M22 12h-6l-2 3h-4l-2-3H2"></path>
    <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"></path>
    {%- elif name == 'key' %}
    <circle cx="7.5" cy="15.5" r="4.5"></circle>
    <path d="m10.7 12.3 9.8-9.8"></path>
    <path d="m17 6 3 3"></path>
    <path d="m14.5 8.5 2 2"></path>
    {%- elif name == 'copy' %}
    <rect x="8" y="8" width="13" height="13" rx="2"></rect>
    <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
    {%- elif name == 'check' %}
    <path d="M20 6 9 17l-5-5"></path>
    {%- elif name == 'search' %}
    <circle cx="11" cy="11" r="7"></circle>
    <path d="m21 21-4.35-4.35"></path>
    {%- elif name == 'menu' %}
    <path d="M4 6h16M4 12h16M4 18h16"></path>
    {%- elif name == 'x' %}
    <path d="M18 6 6 18M6 6l12 12"></path>
    {%- elif name == 'folder' %}
    <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
    {%- elif name == 'chevron-down' %}
    <path d="m6 9 6 6 6-6"></path>
    {%- elif name == 'branch' %}
    <circle cx="6" cy="6" r="2.5"></circle>
    <circle cx="6" cy="18" r="2.5"></circle>
    <circle cx="18" cy="8" r="2.5"></circle>
    <path d="M6 8.5v7M18 10.5c0 4-6 3-11 5.5"></path>
    {%- elif name == 'lock' %}
    <rect x="4" y="11" width="16" height="10" rx="2"></rect>
    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
    {%- elif name == 'user' %}
    <circle cx="12" cy="8" r="4"></circle>
    <path d="M4 21a8 8 0 0 1 16 0"></path>
    {%- elif name == 'linkedin' %}
    <rect x="2" y="2" width="20" height="20" rx="3"></rect>
    <path d="M7 10v7M7 7v.01M11 17v-4a2 2 0 0 1 4 0v4M11 10v7"></path>
    {%- elif name == 'globe' %}
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"></path>
    {%- elif name == 'map-pin' %}
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
    <circle cx="12" cy="10" r="3"></circle>
    {%- elif name == 'download' %}
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    <path d="m7 10 5 5 5-5M12 15V3"></path>
    {%- elif name == 'file' %}
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <path d="M14 2v6h6M8 13h8M8 17h5"></path>
    {%- elif name == 'command' %}
    <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"></path>
    {%- elif name == 'calendar' %}
    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
    <path d="M16 2v4M8 2v4M3 10h18"></path>
    {%- elif name == 'quote' %}
    <path d="M3 21c3 0 7-1 7-8V5H3v8h4c0 4-2 5-4 5zM14 21c3 0 7-1 7-8V5h-7v8h4c0 4-2 5-4 5z"></path>
    {%- elif name == 'logout' %}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
    <path d="m16 17 5-5-5-5M21 12H9"></path>
    {%- endif %}
</svg>
{%- endmacro %}
