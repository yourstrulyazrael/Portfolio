{% extends "base.html" %}

{% block title %}Contact Me{% endblock %}

{% block content %}

<div class="container">

    <header class="page-header text-center pt-0">
        <p class="eyebrow">say hello</p>
        <h1 class="mb-2">Contact Me</h1>
        <p class="text-muted mb-0">
            Have a question or want to get in touch? Send me a message below.
        </p>
    </header>

    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-7">

            <div class="card terminal-card">

                <div class="browser-bar" aria-hidden="true">
                    <span class="browser-dots"><span></span><span></span><span></span></span>
                    <span class="terminal-title">~/contact — new message</span>
                </div>

                <div class="card-body p-4">

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label for="name" class="form-label terminal-label">name</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Your name"
                                    autocomplete="name" maxlength="100" required>
                            </div>

                            <div class="col-sm-6">
                                <label for="email" class="form-label terminal-label">email</label>
                                <input type="email" class="form-control" id="email" name="email" autocomplete="email"
                                    maxlength="255" placeholder="you@example.com" required>
                            </div>

                            <div class="col-12">
                                <label for="message" class="form-label terminal-label">message</label>
                                <textarea class="form-control" id="message" name="message" rows="7"
                                    placeholder="What would you like to talk about?" required maxlength="5000"
                                    aria-describedby="messageCount"></textarea>
                                <div class="form-text text-end font-monospace" id="messageCount">0 / 5000</div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3 btn-icon justify-content-center"
                            data-loading-text="Sending...">
                            <span class="font-monospace" aria-hidden="true">$</span> Send Message
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script>
    (function () {
        var message = document.getElementById("message");
        var count = document.getElementById("messageCount");
        function update() { count.textContent = message.value.length + " / " + message.maxLength; }
        message.addEventListener("input", update);
        update();
    })();
</script>
{% endblock %}
