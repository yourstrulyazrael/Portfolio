{% extends "base.html" %}

{% block title %} Homepage {% endblock %}

{% block content %}
{% for project in projects %}
<div class="project">
    <h2>{{ project.title }}</h2>
    <p>{{project.description }}</p>
    <p>
        Technologies: {{project.technology }}
        <a href="/projects/{{ project.id }}">
            View Project
        </a>
    </p>
</div>

{% endfor %}
{% endblock %}
